# https://taskfile.dev
version: '3'

tasks:
    # ── Testing ───────────────────────────────────────────────────
    test:php:
        desc: Run PHPUnit tests for Blog module
        cmd: php artisan test --testsuite=Modules --filter='^Modules\\Blog\\Tests'

    test:e2e:
        desc: Run E2E tests for Blog module
        cmd: npx playwright test --project="@blog*" {{.CLI_ARGS}}
        interactive: true

    # ── Database ──────────────────────────────────────────────────

    db:seed:demo:
        desc: Seed the Blog module with sample content
        cmd: '{{.APP}} php artisan modules:seed --module=blog --demo'

    # ── Code Generation ────────────────────────────────────────────

    types:generate:
        desc: Generate TypeScript types from PHP DTOs and enums
        cmd: '{{.APP}} php artisan module:generate-types blog'
